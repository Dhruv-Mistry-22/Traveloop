services:
  db:
    image: postgres:16-alpine
    container_name: traveloop-db
    restart: always
    environment:
      - POSTGRES_USER=traveloop_user
      - POSTGRES_PASSWORD=traveloop_password
      - POSTGRES_DB=traveloop_db
    ports:
      - "5432:5432"
    volumes:
      - traveloop_db_data:/var/lib/postgresql/data

volumes:
  traveloop_db_data:
